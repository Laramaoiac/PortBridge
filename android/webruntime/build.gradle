plugins {
    id 'java-library'
}

// Runtime web do PortBridge (Java puro): roteador dos arquivos do app e a ponte
// JavaScript (resources/portbridge/bridge.js). Usado pelo template :web (Android)
// e pelo DevServer/testes no computador.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
