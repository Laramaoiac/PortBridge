[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portbridge"
version = "0.1.0"
description = "Desconstrói apps iOS (.ipa) para reconstrução em Android (.apk)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
portbridge = "portbridge.cli:main"

[tool.setuptools.packages.find]
include = ["portbridge*"]

[tool.setuptools.package-data]
portbridge = ["data/*.json"]
